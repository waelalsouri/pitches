const DECK = (function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.documentElement.classList.add('reduced');
  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const counter = document.getElementById('counter');
  let current = 0, SLIDES = [];

  /* render one slide: CLEAR + REBUILD so its animations fire on mount */
  function show(i){
    if (!SLIDES.length) return;
    current = Math.max(0, Math.min(SLIDES.length - 1, i));
    const s = SLIDES[current];
    const el = document.createElement('section');
    el.className = 'slide';
    el.innerHTML = (typeof s === 'string') ? s : (s.html || '');
    stage.replaceChildren(el);                 // clears previous slide, mounts this one
    if (s && typeof s.onMount === 'function') s.onMount(el, { reduced });  // optional per-slide hook
    bar.style.width = (current / Math.max(1, SLIDES.length - 1) * 100) + '%';
    counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  }
  const next = () => show(current + 1);
  const prev = () => show(current - 1);

  /* nav: click / Space / arrows. One slide per input, never scroll. */
  addEventListener('keydown', e => {
    if (['ArrowRight',' ','Spacebar','PageDown'].includes(e.key)){ e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
    else if (e.key === 'Home'){ show(0); }
    else if (e.key === 'End'){ show(SLIDES.length - 1); }
  });
  addEventListener('click', e => { (e.clientX < innerWidth * 0.33 ? prev : next)(); });

  /* load(slides): hand the engine an array of slides, then start.
     Each slide is either a raw HTML string, or { html, onMount(el,{reduced}) }. */
  function load(slides){ SLIDES = slides || []; show(0); }

  return { load, show, next, prev, reduced };
})();
