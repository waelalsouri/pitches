<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MF · You're booked in</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
  <link rel="stylesheet" href="../assets/funnel.css" />
</head>
<body>
  <header class="brandbar"><img src="../assets/img/mf-mark-dark.png" alt="MF · Muslim Fit" /></header>
  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow reveal">You're booked in, brother</p>
        <h1 class="h1 reveal" style="--i:1">Here's how to get the most out of your <em>MF Consultation Call</em></h1>
      </div>
    </section>

    <div class="container">
      <section class="step">
        <p class="step__label reveal">Step 1 of 3</p>
        <h2 class="h2 reveal">Watch the video below</h2>
        <!-- {{SWAP: welcome video}} -->
        <div class="video thero reveal"><img src="../assets/img/ty-welcome.jpg" alt="Shahib's welcome video" /><span class="video__scrim"></span><span class="video__play"></span><span class="video__tag">Before your call · 4 min</span></div>
      </section>

      <section class="step">
        <p class="step__label reveal">Step 2 of 3</p>
        <h2 class="h2 reveal">Get your questions answered</h2>
        <div class="tgrid">
          <figure class="reveal"><div class="vcard__thumb"><img src="../assets/img/ty-breakout-1.jpg" alt="" loading="lazy" /></div><figcaption>Can I really keep eating my mum's food?</figcaption></figure>
          <figure class="reveal" style="--i:1"><div class="vcard__thumb"><img src="../assets/img/ty-breakout-2.jpg" alt="" loading="lazy" /></div><figcaption>How does this fit around a 9 to 5 and my salah?</figcaption></figure>
          <figure class="reveal" style="--i:2"><div class="vcard__thumb"><img src="../assets/img/ty-breakout-3.jpg" alt="" loading="lazy" /></div><figcaption>What happens on the call?</figcaption></figure>
        </div>
      </section>

      <section class="step">
        <p class="step__label reveal">Step 3 of 3</p>
        <h2 class="h2 reveal">Overcome your suspicions</h2>
        <div class="tgrid">
          <figure class="reveal"><div class="vcard__thumb"><img src="../assets/img/ty-dd-1.jpg" alt="" loading="lazy" /></div><figcaption>I've failed every diet. Why would this be different?</figcaption></figure>
          <figure class="reveal" style="--i:1"><div class="vcard__thumb"><img src="../assets/img/ty-dd-2.jpg" alt="" loading="lazy" /></div><figcaption>I'm 150kg+. Is it too late for me?</figcaption></figure>
          <figure class="reveal" style="--i:2"><div class="vcard__thumb"><img src="../assets/img/ty-dd-3.jpg" alt="" loading="lazy" /></div><figcaption>What if I put in the work and don't lose it?</figcaption></figure>
        </div>
      </section>
    </div>
  </main>
  <footer class="brandfoot"><img src="../assets/img/mf-mark-dark.png" alt="MF" /><span>MF · Muslim Fit</span></footer>
  <script src="../assets/funnel.js"></script>
</body>
</html>
